services:
  - type: web
    name: schooltrip-ai
    runtime: python
    rootDir: trips
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: LANGCHAIN_PROJECT
        value: SchoolTripAI
      - key: PYTHON_VERSION
        value: "3.12.0"
